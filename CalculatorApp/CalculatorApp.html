<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Calculator App</title>
    <style>

        #display {
            width: 290px;
            padding: 40px;
            background-color: dodgerblue;
            border-radius: 10px;
        }

        #result {
            background-color: #f1f1f1;
            color: #000;
            padding: 10px;
            font-size: 30px;
            text-align: right;
            border-radius: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 80px 80px 80px 80px;
            gap: 10px;
            background-color: dodgerblue;
            padding: 10px;
            width: fit-content;
            border-radius: 10px;
        }

            .grid-container > button {
                background-color: #f1f1f1;
                color: #000;
                padding: 10px;
                font-size: 30px;
                text-align: center;
                border: none;
                border-radius: 10px;
            }

        table {
            width: auto;
            border-collapse: collapse;
            margin-top: 20px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #fff; /* White background */
            color: #000; /* Black text */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* Subtle shadow */
        }

        th, td {
            border: 1px solid #000; /* Black borders */
            padding: 10px;
            text-align: left;
            font-size: 16px;
        }

        th {
            background-color: darkslateblue;
            color: #fff; /* White header text */
            font-weight: bold;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) {
            background-color: lightgray; /* Light gray for alternate rows */
        }

        .table-wrapper {
            max-height: 273px; 
            overflow-y: auto; /* Scroll vertically when needed */
        }
    </style>
</head>

<body style="background-color:azure">
    <div id="display">
        <div id='result'>0</div>
    </div>
    <div class="grid-container">
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendOperator('+')">+</button>
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button onclick="appendOperator('-')">-</button>
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button onclick="appendOperator('*')">*</button>
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendDecimal('.')">.</button>
        <button onclick="appendOperator('/')">/</button>
        <button onclick="clearValue()"><<</button>
        <button onclick="appendNegative()">(+/-)</button>
        <button onclick="toggleHistory()">M+</button>
        <button onclick="calculate()">=</button>
    </div>
    <div class="table-wrapper">
        <table id="historyTable" style="display:none">
            <thead>
                <tr>
                    <th>#</th>
                    <th>History</th>
                </tr>
            </thead>
            <tbody>
                <!-- JavaScript will fill this -->
            </tbody>
        </table>
    </div>
</body>

</html>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<script>
    let currentInput = '0';
    let currentOperation = '';
    let previousInput = '';
    let operators = ['+', '-', '*', '/'];
    let history = [];

    function appendNumber(number) {
        if (currentInput == '0' && number == '0') return; //Validation to not allow 00
        if (currentInput == '0' && number != '0') {
            currentInput = number;
        } else {
            currentInput += number;
        }
        document.getElementById('result').innerHTML = `${previousInput} ${currentOperation} ${currentInput}`;
    }

    function appendOperator(operation) {
        if (currentOperation !== '' && currentInput === '') {
            currentOperation = operation;
            document.getElementById('result').innerHTML = `${previousInput} ${currentOperation}`;
            return;
        }

        if (previousInput !== '') {
            calculate(); // Calculate the previous operation before appending a new one
        }
        currentOperation = operation;
        previousInput = currentInput;
        currentInput = '';
        document.getElementById('result').innerHTML = `${previousInput} ${currentOperation}`;
    }

    function appendDecimal(decimal) {
        if (currentInput !== '' && !currentInput.includes(decimal)) {
            currentInput += decimal; 
        } else if (currentInput === '' && previousInput !== '' && !currentInput.includes(decimal)) {
            currentInput += '0.'; //Press decimal after operator
        } 
        document.getElementById('result').innerHTML = `${previousInput} ${currentOperation} ${currentInput}`;
    }

    function appendNegative() {
        if (currentInput === '' || currentInput === '0')
            return;

        if (currentInput[0] === '-') {
            currentInput = currentInput.slice(1);
        } else {
            currentInput = '-' + currentInput;
        }

        document.getElementById('result').innerHTML = `${previousInput} ${currentOperation} ${currentInput}`;
    }

    function calculate() {
        if (previousInput === '' || currentInput === '') return;
        let result;
        let prev = parseFloat(previousInput);
        let current = parseFloat(currentInput);

        switch (currentOperation) {
            case '+':
                result = prev + current;
                break;
            case '-':
                result = prev - current;
                break;
            case '*':
                result = prev * current;
                break;
            case '/':
                if (current === 0) {
                    alert("Cannot divide by zero");
                    return;
                }
                result = prev / current;
                break;
            default:
                return;
        }

        history.push(previousInput + currentOperation + currentInput + '=' + result);
        renderTable(history);
        currentInput = result.toString();
        currentOperation = '';
        previousInput = '';
        document.getElementById('result').innerHTML = currentInput;
    }

    function renderTable(dataArray) {
        let tableBody = document.querySelector("#historyTable tbody");
        tableBody.innerHTML = "";

        dataArray.reverse().forEach((entry, index) => {
            let row = document.createElement("tr");
            let cell = document.createElement("td");
            let numberCell = document.createElement("td");
            cell.textContent = entry;
            numberCell.textContent = index + 1; 
            row.appendChild(numberCell);
            row.appendChild(cell);
            tableBody.appendChild(row);
        });
    }

    function clearDisplay() {
        currentInput = '0';
        previousInput = '';
        currentOperation = '';
        document.getElementById('result').innerHTML = '0';
    }

    function clearValue() {
        if (currentInput !== '') {
            currentInput = currentInput.toString().slice(0, -1);
        } else if (operators.some(operator => document.getElementById('result').innerHTML.trim().slice(-1).includes(operator))) {
            currentOperation = '';
            currentInput = previousInput;
            previousInput = '';
        }

        if (currentInput === '' && previousInput === '') {
            clearDisplay();
        }

        document.getElementById('result').innerHTML = `${previousInput} ${currentOperation} ${currentInput}`;
    }

    function toggleHistory() {
        if (document.getElementById('historyTable').style.display == 'none') {
            document.getElementById('historyTable').style.display = 'block';
        } else {
            document.getElementById('historyTable').style.display = 'none';
        }
    }
</script>
